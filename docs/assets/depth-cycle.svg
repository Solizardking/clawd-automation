<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-label="Survival depth cycle">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="720" height="160" rx="14" fill="#0b1220"/>
  <text x="24" y="32" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="12">SURVIVAL DEPTH · credits → tier</text>
  <!-- track -->
  <rect x="40" y="72" width="640" height="10" rx="5" fill="#1e293b"/>
  <rect x="40" y="72" width="640" height="10" rx="5" fill="url(#g1)" opacity="0.85"/>
  <!-- traveler -->
  <circle cy="77" r="11" fill="#f8fafc" stroke="#22c55e" stroke-width="3">
    <animate attributeName="cx" values="60;200;360;520;660;520;360;200;60" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#22c55e;#eab308;#f97316;#ef4444;#f97316;#eab308;#22c55e" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- labels -->
  <g font-family="ui-monospace,monospace" font-size="11" fill="#cbd5e1">
    <text x="50" y="120">NORMAL</text>
    <text x="190" y="120">LOW_COMPUTE</text>
    <text x="360" y="120">CRITICAL</text>
    <text x="560" y="120">DEAD / BEACH</text>
  </g>
  <text x="40" y="148" fill="#64748b" font-family="ui-monospace,monospace" font-size="10">Law II: only honest work restores depth · Law I always overrides survival</text>
</svg>
