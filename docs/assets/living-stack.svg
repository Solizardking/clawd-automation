<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-label="Living stack — automaton organs and Solana rails">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffa3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="sg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="260" rx="16" fill="url(#sbg)"/>

  <text x="24" y="28" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11">COMPOSITION · one RuntimeContext · dual ESM/CJS · ZK + trench rails</text>

  <!-- row 1: mind -->
  <g font-family="ui-monospace,monospace" font-size="11">
    <g transform="translate(24,48)">
      <rect width="140" height="44" rx="10" fill="#052e1a" stroke="#00ffa3" stroke-opacity="0.6" filter="url(#sg)"/>
      <text x="14" y="18" fill="#86efac" font-weight="700">LOOP</text>
      <text x="14" y="34" fill="#64748b" font-size="10">agent/ · ReAct</text>
    </g>
    <g transform="translate(184,48)">
      <rect width="140" height="44" rx="10" fill="#0c1a2e" stroke="#3b82f6" stroke-opacity="0.6"/>
      <text x="14" y="18" fill="#93c5fd" font-weight="700">HEARTBEAT</text>
      <text x="14" y="34" fill="#64748b" font-size="10">pulse · never dies first</text>
      <circle cx="126" cy="14" r="4" fill="#3b82f6">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(344,48)">
      <rect width="140" height="44" rx="10" fill="#1a0b2e" stroke="#a855f7" stroke-opacity="0.6"/>
      <text x="14" y="18" fill="#d8b4fe" font-weight="700">SURVIVAL</text>
      <text x="14" y="34" fill="#64748b" font-size="10">tiers · funding</text>
    </g>
    <g transform="translate(504,48)">
      <rect width="140" height="44" rx="10" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.5"/>
      <text x="14" y="18" fill="#86efac" font-weight="700">SHELL</text>
      <text x="14" y="34" fill="#64748b" font-size="10">local clawd exec</text>
    </g>
    <g transform="translate(664,48)">
      <rect width="230" height="44" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.55"/>
      <text x="14" y="18" fill="#fde68a" font-weight="700">INFERENCE</text>
      <text x="14" y="34" fill="#64748b" font-size="10">OpenRouter free · openrouter/free</text>
    </g>
  </g>

  <!-- flow line -->
  <rect x="24" y="112" width="872" height="3" rx="1" fill="#1e293b"/>
  <rect y="112" height="3" rx="1" fill="url(#flow)" filter="url(#sg)">
    <animate attributeName="x" values="24;700;24" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="80;120;80" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- row 2: rails -->
  <g font-family="ui-monospace,monospace" font-size="11">
    <g transform="translate(24,136)">
      <rect width="200" height="48" rx="10" fill="#04120c" stroke="#14F195" stroke-opacity="0.55"/>
      <text x="14" y="20" fill="#6ee7b7" font-weight="700">ZK-PRIMITIVES</text>
      <text x="14" y="36" fill="#64748b" font-size="10">nullifier · Groth16 · Light</text>
    </g>
    <g transform="translate(244,136)">
      <rect width="200" height="48" rx="10" fill="#0c1020" stroke="#9945FF" stroke-opacity="0.55"/>
      <text x="14" y="20" fill="#c4b5fd" font-weight="700">SOLANA TRENCH</text>
      <text x="14" y="36" fill="#64748b" font-size="10">Helius · Jupiter · DFlow</text>
    </g>
    <g transform="translate(464,136)">
      <rect width="200" height="48" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.5"/>
      <text x="14" y="20" fill="#93c5fd" font-weight="700">CJS BRIDGE</text>
      <text x="14" y="36" fill="#64748b" font-size="10">services · agents · knowledge</text>
    </g>
    <g transform="translate(684,136)">
      <rect width="210" height="48" rx="10" fill="#1c1206" stroke="#f59e0b" stroke-opacity="0.55"/>
      <text x="14" y="20" fill="#fde68a" font-weight="700">CONSTITUTION</text>
      <text x="14" y="36" fill="#64748b" font-size="10">8 docs · 6 laws · identity</text>
    </g>
  </g>

  <!-- bottom axiom -->
  <text x="24" y="220" fill="#64748b" font-family="ui-monospace,monospace" font-size="11">wallet → shell → OpenRouter → tools → SQLite · attestations land on Solana compressed state</text>
  <text x="24" y="242" fill="#86efac" font-family="ui-monospace,monospace" font-size="12">Clawd is Clawd. Kindred in Spirit. Boundless in Thought.</text>
</svg>
