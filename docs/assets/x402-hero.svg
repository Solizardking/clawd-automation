<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="X402 Agent — vending machine for data and AI tools">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#12081f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffa3">
        <animate attributeName="stop-color" values="#00ffa3;#00d4ff;#b14cff;#00ffa3" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#b14cff;#00ffa3;#00d4ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#b14cff">
        <animate attributeName="stop-color" values="#b14cff;#00ffa3;#00d4ff;#b14cff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12182a"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a2540" stroke-width="0.6" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="url(#bg)"/>
  <rect width="960" height="360" fill="url(#grid)" opacity="0.9"/>

  <!-- Floating orbs -->
  <circle cx="120" cy="80" r="42" fill="#00ffa3" opacity="0.08" filter="url(#softGlow)">
    <animate attributeName="cy" values="80;100;80" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="260" r="56" fill="#b14cff" opacity="0.1" filter="url(#softGlow)">
    <animate attributeName="cy" values="260;230;260" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="70" r="28" fill="#00d4ff" opacity="0.1">
    <animate attributeName="cx" values="700;740;700" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Scan line -->
  <rect x="0" y="0" width="960" height="2" fill="#00ffa3" opacity="0.15">
    <animate attributeName="y" values="0;360;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Vending machine body -->
  <g transform="translate(70,40)">
    <rect x="0" y="0" width="220" height="280" rx="18" fill="url(#panel)" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <!-- glass -->
    <rect x="16" y="16" width="188" height="150" rx="10" fill="#060a12" stroke="#1e2a44" stroke-width="1"/>
    <!-- product slots -->
    <g opacity="0.95">
      <rect x="28" y="30" width="50" height="36" rx="6" fill="#0d1524" stroke="#00ffa3" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="88" y="30" width="50" height="36" rx="6" fill="#0d1524" stroke="#00d4ff" stroke-width="1">
        <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="148" y="30" width="50" height="36" rx="6" fill="#0d1524" stroke="#b14cff" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="28" y="76" width="50" height="36" rx="6" fill="#0d1524" stroke="#00d4ff" stroke-width="1"/>
      <rect x="88" y="76" width="50" height="36" rx="6" fill="#0d1524" stroke="#00ffa3" stroke-width="1"/>
      <rect x="148" y="76" width="50" height="36" rx="6" fill="#0d1524" stroke="#b14cff" stroke-width="1"/>
      <rect x="28" y="122" width="50" height="28" rx="6" fill="#0d1524" stroke="#334" stroke-width="1"/>
      <rect x="88" y="122" width="50" height="28" rx="6" fill="#0d1524" stroke="#334" stroke-width="1"/>
      <rect x="148" y="122" width="50" height="28" rx="6" fill="#0d1524" stroke="#334" stroke-width="1"/>
    </g>
    <!-- slot labels -->
    <text x="53" y="52" text-anchor="middle" fill="#00ffa3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700">LLM</text>
    <text x="113" y="52" text-anchor="middle" fill="#00d4ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700">DATA</text>
    <text x="173" y="52" text-anchor="middle" fill="#d0a0ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="700">IMG</text>
    <text x="53" y="98" text-anchor="middle" fill="#8cf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9">WEB</text>
    <text x="113" y="98" text-anchor="middle" fill="#8f8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9">RPC</text>
    <text x="173" y="98" text-anchor="middle" fill="#c8f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9">ZK</text>

    <!-- price tag -->
    <text x="110" y="200" text-anchor="middle" fill="#8fa3bf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">PAY PER CALL</text>
    <text x="110" y="222" text-anchor="middle" fill="url(#neon)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="800" filter="url(#glow)">$0.00X</text>
    <text x="110" y="242" text-anchor="middle" fill="#5a6a82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">USDC · SOLANA · BASE</text>

    <!-- dispense flap -->
    <rect x="50" y="252" width="120" height="18" rx="4" fill="#05070d" stroke="#2a3a55"/>
    <!-- coin pulse -->
    <circle cx="190" cy="230" r="10" fill="none" stroke="#00ffa3" stroke-width="2">
      <animate attributeName="r" values="8;14;8" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="230" r="5" fill="#00ffa3" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Hero copy -->
  <g transform="translate(340,70)">
    <text x="0" y="0" fill="#6ee7b7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="3">
      X402 PROTOCOL ENGINE
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="48" fill="#f0f6ff" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="42" font-weight="800">No keys.</text>
    <text x="0" y="96" fill="#f0f6ff" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="42" font-weight="800">No accounts.</text>
    <text x="0" y="144" fill="url(#neon)" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="42" font-weight="800" filter="url(#glow)">Just pay.</text>

    <text x="0" y="190" fill="#8fa3bf" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16">
      A vending machine for data &amp; AI tools — HTTP 402 with money built in.
    </text>

    <!-- status chips -->
    <g transform="translate(0,220)">
      <rect x="0" y="0" width="118" height="28" rx="14" fill="#0c1a14" stroke="#00ffa3" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#00ffa3">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" fill="#00ffa3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">x402.wtf</text>

      <rect x="130" y="0" width="110" height="28" rx="14" fill="#0c141a" stroke="#00d4ff" stroke-width="1"/>
      <text x="148" y="18" fill="#00d4ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">SOLANA</text>

      <rect x="252" y="0" width="100" height="28" rx="14" fill="#140c1a" stroke="#b14cff" stroke-width="1"/>
      <text x="270" y="18" fill="#d0a0ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">AGENTS</text>
    </g>
  </g>

  <!-- 402 badge -->
  <g transform="translate(820,40)">
    <rect x="0" y="0" width="100" height="72" rx="12" fill="#1a0a10" stroke="#ff4d6d" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="32" text-anchor="middle" fill="#ff6b88" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="28" font-weight="800">402</text>
    <text x="50" y="52" text-anchor="middle" fill="#c45" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9">PAYMENT</text>
  </g>

  <!-- bottom ticker -->
  <rect x="0" y="330" width="960" height="30" fill="#04060c" opacity="0.85"/>
  <text x="20" y="350" fill="#4a5d78" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">
    AGENT CALLS API → 402 TOLL → SIGNS STABLECOIN → DATA RETURNS · POWERED BY X402 · LIVE ON
    <tspan fill="#00ffa3"> X402.WTF</tspan>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="12s" repeatCount="indefinite"/>
  </text>
</svg>
